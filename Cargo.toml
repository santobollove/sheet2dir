[package]
name = "sheet_processor"
version = "0.1.0"
edition = "2021"

[dependencies]
tokio = { version = "1.0", features = ["full"] }
google-sheets4 = "5.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
regex = "1.0"
chrono = "0.4"
futures = "0.3"
hyper = "0.14"
hyper-rustls = { version = "0.24", features = ["native-tokio", "http1"] }
